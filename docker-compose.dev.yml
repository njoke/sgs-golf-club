version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: sgs_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db

  mongo-express:
    image: mongo-express
    container_name: sgs_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sgs_backend_dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - type: volume
        source: backend_node_modules
        target: /app/node_modules
        volume:
          nocopy: true
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/sgs_golf_club
      JWT_SECRET: dev-secret-replace-in-prod-change-me
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    command: sh -c "if [ ! -f node_modules/.bin/ts-node-dev ]; then mkdir -p /app/node_modules && cp -R /opt/node_modules/. /app/node_modules/; fi && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sgs_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: frontend_next
        target: /app/.next
        volume:
          nocopy: true
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    depends_on:
      - backend
    command: sh -c "if [ ! -f node_modules/.bin/next ]; then mkdir -p /app/node_modules && cp -R /opt/node_modules/. /app/node_modules/; fi && npm run dev"

volumes:
  mongo_data_dev:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
