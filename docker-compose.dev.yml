version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: sgs_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet mongodb://localhost:27017/admin --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-express:
    image: mongo-express
    container_name: sgs_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sgs_backend_dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - type: volume
        source: backend_node_modules
        target: /app/node_modules
        volume:
          nocopy: true
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/sgs_golf_club
      JWT_SECRET: dev-secret-replace-in-prod-change-me
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    command: sh -c "if [ ! -f node_modules/.bin/ts-node-dev ]; then mkdir -p /app/node_modules && cp -R /opt/node_modules/. /app/node_modules/; fi && npm run seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sgs_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: frontend_next
        target: /app/.next
        volume:
          nocopy: true
    environment:
      GRAPHQL_UPSTREAM_URL: http://backend:4000/graphql
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    command: sh -c "if [ ! -f node_modules/.bin/next ]; then mkdir -p /app/node_modules && cp -R /opt/node_modules/. /app/node_modules/; fi && npm run dev"

  cypress:
    image: cypress/included:15.16.0
    container_name: sgs_cypress_dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      CYPRESS_BASE_URL: http://frontend:3000
      CYPRESS_GRAPHQL_URL: http://backend:4000/graphql
      WAIT_LOG_PREFIX: cypress-wait
      WAIT_FRONTEND_BASE_URL: http://frontend:3000
      WAIT_FRONTEND_PATH: /login
      WAIT_BACKEND_HEALTH_URL: http://backend:4000/health
      WAIT_TIMEOUT_MS: 180000
      WAIT_INTERVAL_MS: 2000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    entrypoint:
      - sh
      - tests/cypress/scripts/run-on-start.sh
    restart: "no"

  karate:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: sgs_karate_dev
    working_dir: /workspace/tests/karate
    volumes:
      - .:/workspace
      - type: volume
        source: karate_m2
        target: /root/.m2
        volume:
          nocopy: true
    environment:
      KARATE_BASE_URL: http://backend:4000/graphql
      WAIT_LOG_PREFIX: karate-wait
      WAIT_BACKEND_HEALTH_URL: http://backend:4000/health
      WAIT_SKIP_FRONTEND: "true"
      WAIT_TIMEOUT_MS: 180000
      WAIT_INTERVAL_MS: 2000
    depends_on:
      backend:
        condition: service_healthy
    entrypoint:
      - sh
      - /workspace/tests/karate/scripts/run-on-start.sh
    restart: "no"

volumes:
  mongo_data_dev:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  karate_m2:
